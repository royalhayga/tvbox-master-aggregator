name: 03_独立测试：可可影视真实网页抓取与数据调试

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test_kkys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.11 环境
        uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }

      - run: pip install -r requirements.txt

      - name: 运行 03号可可独立数据调试脚本
        env: { PYTHONUNBUFFERED: "1" }
        run: python3 scripts/test_kkys_debug.py

      - name: Push 可可调试产出 json 数据至 process/ 目录
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add process/kkys_debug_output.json || true
          git diff --cached --quiet && exit 0
          git commit -m "auto: 可可影视真实数据调试输出 [$(date -u '+%Y-%m-%d %H:%M:%S')]"
          git pull --rebase origin main || true
          git push origin HEAD:main --force
