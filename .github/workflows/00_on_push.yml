name: 00_推送代码后连环全流程自动任务链

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.11 环境
        uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt lxml requests tldextract urllib3

      - name: 100% 强行安装 Mihomo 官方 CLI 编译器
        run: |
          mkdir -p bin
          curl -sSL https://github.com/MetaCubeX/mihomo/releases/download/v1.18.10/mihomo-linux-amd64-v1.18.10.gz | gzip -d > bin/mihomo
          chmod +x bin/mihomo
          sudo mv bin/mihomo /usr/local/bin/mihomo
          mihomo --version || true

      - name: 克隆依赖仓库
        run: |
          mkdir -p repos
          git clone --depth 1 https://github.com/jie20091116/cat.git repos/cat || true
          git clone --depth 1 https://github.com/qist/tvbox.git repos/qist || true

      - name: 运行 01号纯净分类合并器 (0 联网发包)
        run: python3 scripts/merge_sources.py

      - name: 运行 07号强力语法净化器
        run: python3 scripts/sanitize_extracted_domains.py

      - name: 运行 08号离线纯内存路由分类器 (0 网络发包)
        run: python3 scripts/classify_offline_domains.py

      - name: 运行 10号策略导出器 (原版 YAML 与 Mihomo .mrs 双重导出)
        run: python3 scripts/export_router_rules.py

      - name: 提交并推送构建结果
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add tvbox.json tvbox_full.json tvbox_multi.json live.txt domains_direct.txt domains_direct.yaml ips_direct.txt ips_direct.yaml domains_proxy.txt clash_rules_direct.yaml clash_rules_proxy.yaml adguard_direct.txt adguard_proxy.txt domains_direct.mrs ips_direct.mrs domains_proxy.mrs not_suitable/ || true
          git diff --cached --quiet && exit 0
          git commit -m "auto: 包含 Mihomo .mrs 二进制规则集的自动全量更新 [$(date -u '+%Y-%m-%d %H:%M:%S')]"
          git pull --rebase origin main || true
          git push origin HEAD:main --force
